<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#09070b" />
  <title>SafeHaven — The Fallen Valley</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07060a;color:#eee8df;font-family:Georgia,'Times New Roman',serif}
    body{display:grid;place-items:center;min-height:100vh}
    main{width:min(680px,88vw);padding:32px;border:1px solid #6f4c58;background:#0d0a10;box-shadow:0 30px 100px #000;text-align:center}
    h1{font-size:clamp(42px,10vw,86px);letter-spacing:.14em;margin:.15em 0}.kicker{font:10px system-ui;letter-spacing:.3em;color:#a35a69}
    p{color:#c6a9b2}a{display:inline-block;margin-top:14px;padding:12px 18px;border:1px solid #655264;color:#eee8df;text-decoration:none;background:#171019}
  </style>
</head>
<body>
  <main>
    <div class="kicker">THE FALLEN VALLEY</div>
    <h1>SAFEHAVEN</h1>
    <p id="status">Opening the compiled battlefield…</p>
    <a id="manual" href="./docs/">ENTER SAFEHAVEN</a>
  </main>
  <script>
    (function(){
      var status=document.getElementById('status');
      fetch('./docs/index.html',{method:'HEAD',cache:'no-store'})
        .then(function(r){if(!r.ok)throw new Error('Compiled site not published yet');location.replace('./docs/');})
        .catch(function(e){status.textContent='The production build has not finished publishing yet. Use ENTER SAFEHAVEN once the GitHub build completes.';console.error(e);});
    })();
  </script>
</body>
</html>
