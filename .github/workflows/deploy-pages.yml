name: Build SafeHaven static Pages files

on:
  push:
    branches:
      - agent/direct-browser-no-vite
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safehaven-static-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/direct-browser-no-vite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build SafeHaven
        run: npm run build

      - name: Verify production runtime
        run: |
          test -s dist/index.html
          test -s dist/js/main.js
          test -s dist/js/app/GameApp.js
          test -s dist/vendor/playcanvas/playcanvas.mjs
          grep -q "SAFEHAVEN" dist/index.html
          grep -q "./app/GameApp.js" dist/js/main.js
          test $(wc -c < dist/vendor/playcanvas/playcanvas.mjs) -gt 100000

      - name: Publish built files into docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R dist/. docs/
          touch docs/.nojekyll

      - name: Commit generated static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Publish compiled SafeHaven static site"
          git push origin HEAD:agent/direct-browser-no-vite
